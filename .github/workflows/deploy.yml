name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            REPO_DIR="$HOME/telegram_download_yt_tt_bot"

            # Clone on first deploy, otherwise pull
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone git@github.com:CherryRadiator/yt_tt_downloader_bot.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            # Only redeploy if there are actual changes
            git fetch origin main
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)

            if [ "$LOCAL" = "$REMOTE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "Already up to date, skipping redeploy."
              exit 0
            fi

            git reset --hard origin/main

            # Rebuild and restart only the bot service
            docker compose pull --quiet 2>/dev/null || true
            docker compose up --build --force-recreate -d --remove-orphans bot

            # Prune unused images to save disk space
            docker image prune -f