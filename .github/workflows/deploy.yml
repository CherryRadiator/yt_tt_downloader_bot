name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            
            REPO_DIR="$HOME/telegram_download_yt_tt_bot"
            
            FRESH_CLONE=false
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/YOUR_USER/telegram_download_yt_tt_bot.git "$REPO_DIR"
              FRESH_CLONE=true
            fi
            
            cd "$REPO_DIR"
            
            git fetch origin main
            
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)
            
            if [ "$FRESH_CLONE" = false ] && [ "$LOCAL" = "$REMOTE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "Already up to date, skipping redeploy."
              exit 0
            fi
            
            git reset --hard origin/main
            
            docker compose up --build --force-recreate -d --remove-orphans bot
            
            docker image prune -f
